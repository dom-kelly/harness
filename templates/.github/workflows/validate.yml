name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # The harness is a private repo: npm needs a token to clone it (HARNESS_TOKEN:
      # a fine-grained PAT with Contents: read on dom-kelly/harness). npm records
      # GitHub git dependencies as SSH URLs in the lockfile, so rewrite both forms.
      - run: |
          git config --global url."https://x-access-token:${HARNESS_TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${HARNESS_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
        env:
          HARNESS_TOKEN: ${{ secrets.HARNESS_TOKEN }}

      - run: npm ci
      - run: npm run validate
